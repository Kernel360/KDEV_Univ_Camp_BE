spring:
  web:
    websocket:
      enabled: true  # WebSocket 활성화

  datasource:
    url: jdbc:mysql://todo-car.cv8eyc8867ij.ap-northeast-2.rds.amazonaws.com:3306/todo-car?autoReconnect=true&useSSL=true&requireSSL=false
    username: admin
    password: 1q2w3e4r!!
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

jwt:
  header: Authorization
  token-validity-in-seconds: 86400  # ✅ 토큰 유효시간 직접 추가 (24시간)
  secret: mySecretKey
  expiration: 86400000  # 24시간 (1일)

logging:
  level:
    root: INFO
    me.silvernine: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # SQL 파라미터 로그

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: mypassword
    key-store-type: PKCS12
    key-alias: mykey

  tomcat:
    keep-alive-timeout: 86400000
    connection-timeout: 86400000

  # ✅ HTTP(8080) 포트도 함께 활성화 (HTTPS와 병행)
  http:
    enabled: true
    port: 8080

---
# ✅ **배치 스케줄링 설정**
batch:
  scheduling:
    enabled: true  # 배치 스케줄링 활성화
    cron: "0 5 0 * * ?"  # 매일 00:05 실행

---
# ✅ **WebSocket 설정**
websocket:
  enabled: true  # WebSocket 활성화
  endpoint: "/battery-status"  # WebSocket 엔드포인트 설정
  allowed-origins: "*"  # 모든 출처 허용 (보안 설정 필요하면 변경)
  buffer-size: 8192  # 메시지 버퍼 크기 (기본값: 8192)

